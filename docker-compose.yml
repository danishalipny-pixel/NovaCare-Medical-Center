services:
  # NovaCare Node.js Backend & Frontend Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacare_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-novacare_production_jwt_secret_minimum_32_characters_key}
      JWT_EXPIRES_IN: 24h
      DB_CLIENT: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: novacare_user
      DB_PASSWORD: ${DB_PASSWORD:-novacare_secure_pass_2026}
      DB_NAME: novacare_hospital_db
      DB_SSL: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - novacare_network

  # MySQL 8.0 Production Database
  db:
    image: mysql:8.0
    container_name: novacare_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_super_secure_pass_2026}
      MYSQL_DATABASE: novacare_hospital_db
      MYSQL_USER: novacare_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-novacare_secure_pass_2026}
    volumes:
      - novacare_mysql_data:/var/lib/mysql
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seeds/001_initial_seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD:-root_super_secure_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novacare_network

volumes:
  novacare_mysql_data:
    driver: local

networks:
  novacare_network:
    driver: bridge
